<style>
/* Layout: una domanda per schermata, con il profilo che si costruisce a lato mentre si risponde.
   Le risposte sono ovali da scheda elettorale; i partiti hanno forma e colore propri (cerchio, rombo, quadrato). */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#0E1726; --ink2:#434F65; --mute:#5D6980; --line:#D3D9E3; --track:#E3E8F0;
  --me:#0A7C74; --me-ink:#FFFFFF; --soft:#D9EFEC; --pd:#D4452A; --fdi:#2450C8; --m5s:#C28A00; --fn:#8E3FB8; --fi:#D6409F; --lg:#1E9E4F; --av:#9A5B2A; --iv:#E85C0D; --az:#154C79; --eu:#D49200; --nm:#2471A3; --pap:#9A2453; --focus:#0E1726;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1120; --surface:#141C2F; --ink:#EAEFF8; --ink2:#B0BACD; --mute:#8F9CB3; --line:#26304A; --track:#1E2840;
  --me:#3DCBC0; --me-ink:#06201E; --soft:#10332F; --pd:#FF7B5C; --fdi:#7399FF; --m5s:#F5C542; --fn:#C99BFF; --fi:#FF8AD1; --lg:#5FD68C; --av:#E0A36B; --iv:#FF7A33; --az:#4B94D6; --eu:#FCD34D; --nm:#5DADE2; --pap:#F07BA8; --focus:#EAEFF8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#141C2F; --ink:#EAEFF8; --ink2:#B0BACD; --mute:#8F9CB3; --line:#26304A; --track:#1E2840;
  --me:#3DCBC0; --me-ink:#06201E; --soft:#10332F; --pd:#FF7B5C; --fdi:#7399FF; --m5s:#F5C542; --fn:#C99BFF; --fi:#FF8AD1; --lg:#5FD68C; --av:#E0A36B; --iv:#FF7A33; --az:#4B94D6; --eu:#FCD34D; --nm:#5DADE2; --pap:#F07BA8; --focus:#EAEFF8; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);padding-inline:16px;padding-block:0 48px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.08}
p{margin:0}
.wrap{max-width:1080px;margin-inline:auto}
/* barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;margin-inline:-16px;padding-inline:16px}
.bar .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font:800 20px/1 var(--f-display);letter-spacing:-.03em;display:flex;align-items:center;gap:10px;border:0;background:none;padding:0}
.brand svg{width:26px;height:26px;flex:none}
.prog{flex:1;min-width:140px;display:flex;flex-direction:column;gap:6px}
.prog .t{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.segs{display:flex;gap:3px;height:6px}
.segs i{flex:1;background:var(--track);border-radius:3px;overflow:hidden;position:relative}
.segs i b{position:absolute;inset:0 auto 0 0;background:var(--me);border-radius:3px;transition:width .3s}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:500;font-size:14px}
.pill:hover{border-color:var(--ink2)}
/* pannello sezioni */
.menu{position:absolute;right:0;top:100%;margin-top:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:8px;width:min(380px,calc(100vw - 32px));box-shadow:0 18px 40px rgba(8,14,28,.22);max-height:calc(100vh - 96px);max-height:calc(100dvh - 96px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.menu button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;font-size:15px}
.menu button:hover{background:var(--track)}
.menu button[aria-current=true]{background:var(--soft)}
.menu .n{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.menu .done .n{color:var(--me);font-weight:600}
.barin{position:relative;width:100%}
/* intro */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:40px;align-items:center;padding-block:44px 24px}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:800;letter-spacing:-.04em}
.hero .lead{font-size:19px;color:var(--ink2);max-width:46ch;margin-top:20px}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px}
.facts div{display:flex;flex-direction:column}
.facts b{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.facts span{font-size:14px;color:var(--ink2)}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:14px 28px;font-weight:600;font-size:17px}
.btn:hover{background:var(--me);border-color:var(--me);color:var(--me-ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--track);color:var(--ink);border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.ballot{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:28px}
.ballot h3{font-size:15px;font-weight:600;color:var(--ink2);font-family:var(--f-body);letter-spacing:0;margin-bottom:6px}
.ballot .demo{font:600 22px/1.25 var(--f-display);margin-bottom:22px}
.ovals{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ov{border:2.5px solid var(--ink);border-radius:50%;background:transparent;display:grid;place-items:center;flex:none;padding:0;transition:background .15s,transform .15s}
.ov svg{width:60%;height:60%;opacity:0}
.ov:hover{background:var(--soft)}
.ov[aria-checked=true]{background:var(--me);border-color:var(--me)}
.ov[aria-checked=true] svg{opacity:1}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:12px;gap:12px}
.notes{max-width:68ch;color:var(--ink2);font-size:14px;margin-top:8px;padding-bottom:12px}
/* flusso */
.flow{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:48px;padding-block:28px 24px;align-items:start}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,44px);min-height:420px;display:flex;flex-direction:column}
.where{font-size:14px;color:var(--ink2);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.q{font:600 clamp(22px,3vw,32px)/1.22 var(--f-display);letter-spacing:-.025em;margin-block:18px 24px;text-wrap:pretty;max-width:32em}

<template id="economy-guide-template"><header class="guide-hero" id="guide-top"><div class="eyebrow">Guida alle domande</div><h1>Economia, fisco e impresa</h1><p>Per ogni affermazione trovi il tema in gioco e alcune ragioni possibili per essere pienamente d’accordo o in disaccordo. Sono spunti per chiarire il significato della domanda, non argomenti esaustivi né indicazioni su quale risposta scegliere.</p></header>
<article class="guide-item" id="q1"><h2>Domanda 1 · Imposte e servizi pubblici</h2><p class="guide-question">In Italia le imposte dovrebbero essere ridotte, anche se ci&#242; comportasse una riduzione o una riorganizzazione di alcuni servizi pubblici.</p><p class="guide-what"><b>Che cosa valuta.</b> Il compromesso tra ridurre le imposte e mantenere servizi pubblici adeguati.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>Si pu&#242; ritenere che famiglie e imprese debbano trattenere pi&#249; reddito e che imposte pi&#249; basse favoriscano consumi e investimenti. Si pu&#242; anche pensare che i servizi possano essere riorganizzati con maggiore efficienza.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Si pu&#242; considerare prioritario garantire servizi accessibili a tutti, come sanit&#224;, scuola e trasporti. Ridurre le imposte senza ridurre la spesa necessaria potrebbe peggiorare i servizi o aumentare il debito.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q2"><h2>Domanda 2 · Progressivit&#224; delle imposte</h2><p class="guide-question">Il sistema fiscale dovrebbe aumentare l’aliquota effettiva al crescere del reddito.</p><p class="guide-what"><b>Che cosa valuta.</b> Quanto il contributo fiscale debba crescere insieme alla capacit&#224; economica.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>Si pu&#242; ritenere giusto chiedere un contributo maggiore a chi ha pi&#249; risorse, per distribuire il carico fiscale e finanziare servizi e politiche redistributive.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Si pu&#242; temere che aliquote pi&#249; alte riducano gli incentivi a lavorare, investire o assumersi responsabilit&#224; economiche. Si pu&#242; preferire una differenza pi&#249; contenuta tra contribuenti.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q3"><h2>Domanda 3 · Flat tax e scaglioni</h2><p class="guide-question">Una tassa unica ad aliquota fissa (flat tax) sarebbe pi&#249; giusta e pi&#249; semplice dell’attuale sistema a scaglioni.</p><p class="guide-what"><b>Che cosa valuta.</b> Se si preferisce un’aliquota unica oppure aliquote crescenti per fasce di reddito.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>Un’aliquota unica pu&#242; apparire pi&#249; semplice da capire e applicare e pu&#242; ridurre adempimenti e complessit&#224;.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Gli scaglioni possono graduare il contributo in base al reddito e tutelare chi guadagna meno. Si pu&#242; anche dubitare che un’aliquota unica sia sostenibile senza ridurre entrate o servizi.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q4"><h2>Domanda 4 · Patrimoni elevati</h2><p class="guide-question">Serve un’imposta patrimoniale sui grandi patrimoni.</p><p class="guide-what"><b>Che cosa valuta.</b> Se la ricchezza accumulata debba essere tassata oltre ai redditi e ai consumi.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>Un contributo sui patrimoni molto elevati pu&#242; apparire un modo per limitare la concentrazione della ricchezza e finanziare servizi o investimenti pubblici.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Patrimoni e beni possono essere considerati gi&#224; tassati al momento dell’acquisto o dell’accumulo. Si possono temere problemi di valutazione, trasferimenti di capitali o imposte su beni difficili da liquidare.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q5"><h2>Domanda 5 · Imposta di successione</h2><p class="guide-question">L’imposta di successione dovrebbe essere pi&#249; alta per le grandi eredit&#224;.</p><p class="guide-what"><b>Che cosa valuta.</b> Il ruolo della tassazione nel trasferimento della ricchezza tra generazioni.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>Le grandi eredit&#224; possono offrire vantaggi indipendenti dal merito personale; tassarle di pi&#249; potrebbe ridurre le disuguaglianze di partenza.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Il patrimonio pu&#242; essere visto come frutto di risparmi e lavoro gi&#224; tassati, che &#232; legittimo trasmettere ai familiari. Si possono temere effetti sulle imprese familiari o su beni senza liquidit&#224; sufficiente.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q6"><h2>Domanda 6 · Lotta all’evasione</h2><p class="guide-question">Se le risorse sono limitate, il governo dovrebbe dare priorit&#224; alla lotta all’evasione rispetto alla riduzione delle imposte.</p><p class="guide-what"><b>Che cosa valuta.</b> Quale obiettivo fiscale debba venire prima quando risorse e attenzione sono limitate.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>Far rispettare le imposte esistenti pu&#242; rendere il sistema pi&#249; equo e finanziare i servizi senza aumentare il carico su chi gi&#224; paga.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Ridurre il peso fiscale pu&#242; essere considerato prioritario per sostenere redditi e attivit&#224; economica. Si pu&#242; ritenere importante contrastare l’evasione senza rinviare gli sgravi.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q7"><h2>Domanda 7 · Condoni e rottamazioni</h2><p class="guide-question">I condoni fiscali e le rottamazioni sono accettabili per recuperare gettito e chiudere il contenzioso.</p><p class="guide-what"><b>Che cosa valuta.</b> Se agevolare la chiusura di vecchi debiti e contenziosi sia un compromesso accettabile.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>Si pu&#242; preferire recuperare almeno una parte delle somme dovute e ridurre pratiche che altrimenti resterebbero aperte a lungo o costerebbero molto da gestire.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Queste misure possono penalizzare chi ha pagato regolarmente e indurre altri ad aspettare future agevolazioni. Si pu&#242; temere che indeboliscano la fiducia nelle regole.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q8"><h2>Domanda 8 · Imprese pubbliche strategiche</h2><p class="guide-question">Lo Stato dovrebbe avere aziende pubbliche in settori strategici come energia, reti e trasporti.</p><p class="guide-what"><b>Che cosa valuta.</b> Quanto direttamente lo Stato debba possedere o gestire attivit&#224; considerate essenziali.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>La propriet&#224; pubblica pu&#242; garantire controllo e continuit&#224; in settori importanti per la sicurezza e per l’intero Paese.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Si pu&#242; preferire che lo Stato regoli e controlli senza gestire le imprese. La gestione pubblica pu&#242; essere esposta a interferenze politiche, inefficienze e costi per i contribuenti.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q9"><h2>Domanda 9 · Privatizzazioni</h2><p class="guide-question">Le privatizzazioni hanno fatto pi&#249; bene che male all’economia italiana.</p><p class="guide-what"><b>Che cosa valuta.</b> Il giudizio complessivo sul trasferimento di imprese pubbliche a soggetti privati.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>La gestione privata pu&#242; aver favorito efficienza, investimenti e concorrenza, riducendo il peso diretto dello Stato nell’economia.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Le privatizzazioni possono aver ridotto il controllo pubblico su servizi essenziali o favorito concentrazioni private. La concorrenza pu&#242; essere limitata quando il mercato &#232; dominato da pochi operatori.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q10"><h2>Domanda 10 · Mercato e intervento pubblico</h2><p class="guide-question">In generale, per far crescere l’economia &#232; preferibile affidarsi al mercato e alla concorrenza anzich&#233; all’intervento pubblico.</p><p class="guide-what"><b>Che cosa valuta.</b> Quale ruolo debba avere lo Stato nel guidare e correggere l’economia.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>La concorrenza pu&#242; favorire innovazione, scelta e attenzione ai costi; decisioni pubbliche troppo estese possono risultare lente o poco attente alle necessit&#224; degli utenti.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>I mercati non sempre garantiscono accesso ai servizi, tutela ambientale o minori disuguaglianze. Si pu&#242; ritenere necessario l’intervento pubblico per correggere questi effetti o garantire beni essenziali.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q11"><h2>Domanda 11 · Aiuti alle imprese in crisi</h2><p class="guide-question">Lo Stato dovrebbe sostenere con denaro pubblico le imprese in crisi per salvare i posti di lavoro.</p><p class="guide-what"><b>Che cosa valuta.</b> Se salvaguardare imprese e occupazione giustifichi l’uso di risorse pubbliche.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>Un sostegno temporaneo pu&#242; evitare la perdita di competenze e posti di lavoro, proteggere una filiera o dare tempo all’impresa di riorganizzarsi.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Le risorse pubbliche potrebbero mantenere in vita attivit&#224; non sostenibili e trasferire le perdite sui contribuenti. Gli aiuti possono svantaggiare concorrenti che non li ricevono.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q12"><h2>Domanda 12 · Debito e spesa pubblica</h2><p class="guide-question">Il debito pubblico &#232; abbastanza grave da richiedere tagli alla spesa.</p><p class="guide-what"><b>Che cosa valuta.</b> Se il livello del debito renda necessaria una riduzione della spesa pubblica.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>Interessi e debito possono limitare le scelte future e aumentare il peso sulle prossime generazioni. Ridurre alcune spese pu&#242; rendere i conti pi&#249; sostenibili.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Tagli generalizzati possono danneggiare servizi e investimenti, frenando l’economia e le entrate future. Si pu&#242; preferire intervenire selettivamente o aumentare le entrate.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q13"><h2>Domanda 13 · Investimenti e deficit</h2><p class="guide-question">Per far crescere l’economia, lo Stato deve investire di pi&#249; anche andando in deficit.</p><p class="guide-what"><b>Che cosa valuta.</b> Se sia accettabile aumentare il debito per finanziare investimenti pubblici e crescita.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>Investimenti in infrastrutture, istruzione o innovazione possono produrre benefici duraturi, specialmente quando il settore privato investe poco.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Il debito aggiuntivo genera interessi senza garantire risultati. Si pu&#242; dubitare che le istituzioni scelgano e realizzino progetti davvero efficaci.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q14"><h2>Domanda 14 · PMI e concorrenza straniera</h2><p class="guide-question">Le piccole e medie imprese italiane vanno protette dalla concorrenza straniera.</p><p class="guide-what"><b>Che cosa valuta.</b> Quanto proteggere le imprese nazionali dalla concorrenza internazionale.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>Le PMI sono spesso pi&#249; vulnerabili dei grandi gruppi; proteggerle pu&#242; preservare occupazione, competenze e filiere locali, soprattutto se le regole sono diverse.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>La protezione pu&#242; ridurre gli incentivi a innovare e migliorare la produttivit&#224;, oltre a limitare la scelta e aumentare i prezzi per consumatori e altre imprese.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q15"><h2>Domanda 15 · Concessioni e concorrenza</h2><p class="guide-question">Concessioni come spiagge e taxi andrebbero aperte alla concorrenza anche a danno degli operatori attuali.</p><p class="guide-what"><b>Che cosa valuta.</b> Se ampliare la concorrenza e l’accesso alle concessioni debba prevalere sulla tutela degli operatori attuali.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>Procedure pi&#249; aperte possono dare spazio a nuovi operatori, migliorare i servizi e rendere pi&#249; trasparente l’uso di risorse limitate.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Gli operatori attuali possono aver investito facendo affidamento sulle regole esistenti. Cambiamenti bruschi possono svalutare gli investimenti e creare instabilit&#224; per lavoratori e servizi.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q16"><h2>Domanda 16 · Specializzazione produttiva</h2><p class="guide-question">L’Italia dovrebbe puntare soprattutto su made in Italy, turismo e agroalimentare pi&#249; che sull’industria pesante.</p><p class="guide-what"><b>Che cosa valuta.</b> Quali settori debbano avere maggiore priorit&#224; nella strategia economica nazionale.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>Questi ambiti valorizzano prodotti, competenze e attrattive riconosciuti e possono sostenere imprese e occupazione in molti territori.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Dipendere da pochi settori pu&#242; rendere l’economia pi&#249; vulnerabile. Una base produttiva diversificata, compresa l’industria pesante, pu&#242; sostenere capacit&#224; tecnologiche e lavoro qualificato.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q17"><h2>Domanda 17 · Dazi e protezione industriale</h2><p class="guide-question">Dazi e barriere commerciali sono uno strumento legittimo per difendere l’industria nazionale.</p><p class="guide-what"><b>Che cosa valuta.</b> Se limitare le importazioni sia uno strumento legittimo di politica industriale.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>I dazi possono aiutare le imprese nazionali a competere con produttori soggetti a regole o costi diversi e proteggere capacit&#224; produttive strategiche.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>I dazi possono aumentare i prezzi e provocare ritorsioni che danneggiano le esportazioni. Si pu&#242; preferire sostenere l’industria con investimenti, formazione o innovazione.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q18"><h2>Domanda 18 · Grandi opere</h2><p class="guide-question">Grandi opere come il Ponte sullo Stretto sono un investimento utile per il Paese.</p><p class="guide-what"><b>Che cosa valuta.</b> Se i benefici attesi da una grande infrastruttura giustifichino costi e impatti.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>L’opera pu&#242; migliorare i collegamenti, sostenere attivit&#224; economiche e rendere pi&#249; accessibili territori oggi meno connessi.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>I costi finanziari, ambientali o territoriali possono apparire troppo alti e i benefici incerti. Si possono preferire manutenzione, trasporti locali o progetti con effetti pi&#249; immediati.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q214"><h2>Domanda 214 · Case popolari e affitti</h2><p class="guide-question">Servono pi&#249; case popolari e un limite agli aumenti degli affitti.</p><p class="guide-what"><b>Che cosa valuta.</b> Quanto debba intervenire il settore pubblico per rendere la casa pi&#249; accessibile.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>La casa &#232; un bisogno essenziale; pi&#249; edilizia pubblica e limiti agli aumenti possono proteggere chi fatica a sostenere i canoni, soprattutto dove l’offerta &#232; scarsa.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Limiti agli affitti possono ridurre l’interesse a offrire o mantenere abitazioni, aggravando la scarsit&#224;. Si pu&#242; preferire aumentare l’offerta o sostenere direttamente le famiglie.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q215"><h2>Domanda 215 · Affitti brevi turistici</h2><p class="guide-question">Gli affitti brevi turistici vanno limitati per tutelare i residenti.</p><p class="guide-what"><b>Che cosa valuta.</b> Il bilanciamento tra turismo, disponibilit&#224; di abitazioni e vita dei residenti.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>In alcune zone gli affitti brevi possono ridurre gli alloggi per residenti e lavoratori e rendere pi&#249; difficile mantenere comunit&#224; stabili.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>Gli affitti brevi portano reddito ai proprietari e sostengono turismo e attivit&#224; locali. Si possono preferire regole mirate alle aree pi&#249; sotto pressione invece di limiti generali.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
<article class="guide-item" id="q217"><h2>Domanda 217 · Extraprofitti</h2><p class="guide-question">Gli extraprofitti di banche e aziende energetiche vanno tassati.</p><p class="guide-what"><b>Che cosa valuta.</b> Se profitti eccezionali in settori essenziali debbano comportare un contributo fiscale aggiuntivo.</p><div class="guide-sides"><section class="guide-side"><h3>Pienamente d&#8217;accordo</h3><p>Si pu&#242; ritenere giusto recuperare una parte dei guadagni eccezionali, soprattutto se maturati mentre aumentavano i costi per famiglie e imprese, e usare le risorse per compensarne gli effetti.</p></section><section class="guide-side"><h3>Pienamente in disaccordo</h3><p>“Extraprofitti” pu&#242; essere difficile da definire con certezza e imposte straordinarie possono rendere meno prevedibili le regole. Il costo potrebbe ricadere su clienti, investimenti o credito.</p></section></div><a class="guide-end" href="#guide-top">Torna su ↑</a></article>
</template>
<script>
const CFG={"id":"nazionale","shareId":null,"title":"Scheda Politica","subtitle":"","fileName":"scheda-politica","storeKey":"scheda-politica-profili-v1","legacyKey":"scheda-politica-v3","w":{"p":"partito","ps":"partiti"},"layers":true,"map":true,"openSection":11,"whyDefault":"Voto assegnato dal programma e dalle posizioni recenti del partito.","rankTitle":"Vicinanza ai partiti","shareFooter":"Confronto basato su programmi e posizioni pubbliche dei partiti. Non è un giudizio.","intro":{"h1":"Dove ti colloca quello che pensi?","lead":"Rispondi a {TOTAL} affermazioni su economia, Europa, guerra, diritti, ambiente e tecnologia. Alla fine vedi il tuo profilo su otto temi e quanto sei vicino a PD, Fratelli d'Italia, Movimento 5 Stelle, Futuro Nazionale, Forza Italia, Lega, Alleanza Verdi e Sinistra, Italia Viva, Azione, +Europa, Noi Moderati e Potere al Popolo!","facts":[["{TOTAL}","affermazioni"],["{AXES}","temi nel profilo"],["40 min","circa, anche a pezzi"]],"demo":"Servirebbe una tassa sui grandi patrimoni.","notes":"Il confronto con i partiti si basa sul programma del PD 2022 con le posizioni recenti, sul programma del centrodestra 2022 con le posizioni recenti di Fratelli d'Italia e sul programma 2022 del Movimento 5 Stelle con i 20 punti di Nova (2026). I voti ai partiti li ho assegnati io leggendo quei testi e i voti in aula (Openpolis, 2024-2026). È un modo per orientarsi, non un giudizio. Le risposte restano solo nel tuo browser. Il profilo è anonimo: non serve nessun dato personale. Dal pulsante in alto puoi crearne altri, per esempio per altre persone che usano lo stesso dispositivo."},"sections":[{"t":"1. Economia, fisco e impresa","q":[[1,"In Italia le imposte dovrebbero essere ridotte, anche se ciò comportasse una riduzione o una riorganizzazione di alcuni servizi pubblici."],[2,"Il sistema fiscale dovrebbe aumentare l'aliquota effettiva al crescere del reddito."],[3,"Una tassa unica ad aliquota fissa (flat tax) sarebbe più giusta e più semplice dell'attuale sistema a scaglioni."],[4,"Serve un'imposta patrimoniale sui grandi patrimoni."],[5,"L'imposta di successione dovrebbe essere più alta per le grandi eredità."],[6,"Se le risorse sono limitate, il governo dovrebbe dare priorità alla lotta all'evasione rispetto alla riduzione delle imposte."],[7,"I condoni fiscali e le rottamazioni sono accettabili per recuperare gettito e chiudere il contenzioso."],[8,"Lo Stato dovrebbe avere aziende pubbliche in settori strategici come energia, reti e trasporti."],[9,"Le privatizzazioni hanno fatto più bene che male all'economia italiana."],[10,"In generale, per far crescere l'economia è preferibile affidarsi al mercato e alla concorrenza anziché all'intervento pubblico."],[11,"Lo Stato dovrebbe sostenere con denaro pubblico le imprese in crisi per salvare i posti di lavoro."],[12,"Il debito pubblico è abbastanza grave da richiedere tagli alla spesa."],[13,"Per far crescere l'economia, lo Stato deve investire di più anche andando in deficit."],[14,"Le piccole e medie imprese italiane vanno protette dalla concorrenza straniera."],[15,"Concessioni come spiagge e taxi andrebbero aperte alla concorrenza anche a danno degli operatori attuali."],[16,"L'Italia dovrebbe puntare soprattutto su made in Italy, turismo e agroalimentare più che sull'industria pesante."],[17,"Dazi e barriere commerciali sono uno strumento legittimo per difendere l'industria nazionale."],[18,"Grandi opere come il Ponte sullo Stretto sono un investimento utile per il Paese."],[214,"Servono più case popolari e un limite agli aumenti degli affitti."],[215,"Gli affitti brevi turistici vanno limitati per tutelare i residenti."],[217,"Gli extraprofitti di banche e aziende energetiche vanno tassati."]]},{"t":"2. Lavoro, welfare, pensioni, sanità e scuola","q":[[19,"Il mercato del lavoro deve essere più flessibile, anche se significa meno tutele rigide."],[20,"Va introdotto un salario minimo per legge."],[21,"Lo Stato dovrebbe garantire un sostegno economico alle persone in povertà che rispettano i requisiti previsti."],[22,"Chi riceve un sussidio e rifiuta senza giustificato motivo un'offerta di lavoro adeguata dovrebbe subire una riduzione del sostegno."],[23,"Servirebbe la settimana lavorativa di quattro giorni a parità di stipendio."],[24,"Il lavoro precario e i contratti a termine vanno limitati per legge."],[25,"I sindacati hanno ancora un ruolo importante e andrebbero rafforzati."],[26,"L'età della pensione non dovrebbe salire ulteriormente, nemmeno con l'aumento dell'aspettativa di vita."],[27,"Il sistema pensionistico dovrebbe dare più peso ai fondi privati e meno alla previdenza pubblica."],[28,"Le regole attuali di pensioni e welfare distribuiscono risorse in modo sfavorevole alle generazioni più giovani."],[29,"La sanità dovrebbe essere gestita soprattutto dallo Stato, non da privati."],[30,"Per ridurre le liste d'attesa è giusto affidarsi di più alle strutture private convenzionate."],[31,"Il medico di base e la sanità territoriale vanno riformati profondamente."],[32,"La scuola pubblica dovrebbe ricevere molte più risorse, anche a scapito di altri settori."],[33,"Le scuole paritarie private dovrebbero ricevere finanziamenti pubblici."],[34,"Gli studenti dovrebbero essere valutati e selezionati di più in base al merito, fin dalle scuole superiori."],[35,"Gli insegnanti dovrebbero essere pagati in base ai risultati e non solo all'anzianità."],[36,"L'università dovrebbe essere molto più legata alle esigenze delle imprese."],[37,"Le tasse universitarie dovrebbero essere abolite o ridotte al minimo."],[38,"Lo Stato dovrebbe sostenere economicamente le famiglie che fanno figli, anche con forti incentivi alla natalità."],[216,"Contro le morti sul lavoro servono controlli e sanzioni molto più severi."],[218,"Il diritto di sciopero nei servizi essenziali (trasporti, sanità) va limitato."],[219,"Il reddito di cittadinanza andrebbe ripristinato nella sua forma originaria."]]},{"t":"3. Istituzioni, autonomie, giustizia e democrazia","q":[[39,"Il Presidente del Consiglio dovrebbe essere eletto direttamente dai cittadini."],[40,"L'Italia dovrebbe passare a un sistema presidenziale con un presidente eletto dal popolo."],[41,"Il Parlamento dovrebbe restare il centro del sistema, anche a costo di governi meno stabili."],[42,"La legge elettorale dovrebbe garantire sempre un vincitore chiaro la sera delle elezioni, anche con un premio di maggioranza."],[43,"La legge elettorale dovrebbe essere proporzionale pura, anche se rende i governi più fragili."],[44,"Gli elettori dovrebbero poter scegliere direttamente i parlamentari con le preferenze, non solo i partiti."],[45,"Il numero dei parlamentari è stato ridotto giustamente e si potrebbe ridurre ancora."],[46,"Le Regioni dovrebbero avere più autonomia, anche in materie come sanità e istruzione."],[47,"L'autonomia differenziata rischia di aumentare le disuguaglianze tra Nord e Sud."],[48,"Le Province e gli enti locali intermedi andrebbero ridotti o eliminati."],[49,"Il Senato dovrebbe diventare una camera delle autonomie e non avere più gli stessi poteri della Camera."],[50,"Servirebbe più democrazia diretta, con referendum più facili da proporre e con meno vincoli."],[51,"La burocrazia è il principale freno del Paese e va ridotta drasticamente."],[52,"I dipendenti pubblici dovrebbero poter essere licenziati più facilmente per scarso rendimento."],[53,"La separazione delle carriere tra giudici e pubblici ministeri è una riforma necessaria."],[54,"La politica dovrebbe avere più controllo sull'operato dei magistrati."],[55,"Per abbreviare i processi, si potrebbero modificare alcune garanzie procedurali, mantenendo quelle essenziali per il diritto di difesa."],[56,"Le intercettazioni sono uno strumento essenziale per le indagini."],[57,"Il garantismo (presunzione di innocenza fino a sentenza definitiva) deve essere rispettato anche per i politici indagati."],[58,"La Costituzione del 1948 funziona bene e va cambiata il meno possibile."],[205,"In caso di urgenza il governo dovrebbe poter governare per decreto più facilmente."],[206,"La Corte costituzionale ha troppo potere rispetto al Parlamento."],[207,"Le autorità indipendenti (Garante privacy, Anac) dovrebbero avere più poteri di controllo sul governo."],[222,"Chi viene eletto dovrebbe poter fare al massimo due mandati."],[223,"Il governo dovrebbe poter essere sfiduciato solo con la nomina di un successore (sfiducia costruttiva)."],[224,"I magistrati dovrebbero rispondere civilmente degli errori commessi."]]},{"t":"4. Unione Europea","q":[[59,"L'Unione Europea dovrebbe avere più competenze e poteri decisionali rispetto ai singoli Stati membri."],[60,"L'Italia dovrebbe recuperare maggiore autonomia dalle decisioni di Bruxelles."],[61,"L'appartenenza all'Unione Europea ha portato all'Italia più vantaggi che svantaggi."],[62,"L'euro è stato un bene per l'Italia."],[63,"L'Italia starebbe meglio fuori dall'euro, con una moneta propria."],[64,"Le regole europee su deficit e debito andrebbero rese meno rigide."],[65,"L'Unione Europea dovrebbe emettere debito comune per finanziare grandi investimenti (difesa, energia, tecnologia)."],[66,"L'Unione Europea dovrebbe avere un esercito comune."],[67,"Le decisioni europee su politica estera e difesa dovrebbero essere prese a maggioranza e non all'unanimità."],[68,"Le regole europee su ambiente, agricoltura e automotive andrebbero allentate."],[69,"I paesi dell'UE dovrebbero condividere in modo obbligatorio l'accoglienza dei richiedenti asilo."],[70,"L'Unione Europea dovrebbe allargarsi ad altri paesi (Balcani, Ucraina, Moldavia)."],[71,"L'Italia dovrebbe avere più peso in Europa, anche alleandosi con paesi che criticano Bruxelles."],[72,"I fondi europei del PNRR sono stati un'occasione ben sfruttata dall'Italia."],[201,"L'Italia dovrebbe poter non applicare le regole europee che ritiene contrarie al proprio interesse."],[202,"Le sentenze dei giudici europei non dovrebbero prevalere sulle leggi italiane."],[203,"L'Italia dovrebbe versare meno soldi al bilancio dell'Unione europea."],[204,"Il Parlamento europeo dovrebbe avere più poteri della Commissione e dei governi."],[225,"Il Mes andrebbe ratificato senza condizioni."]]},{"t":"5. Ucraina, guerra, difesa e Medio Oriente","q":[[73,"L'Italia dovrebbe continuare a fornire armi all'Ucraina per sostenerne la difesa."],[74,"L'Italia dovrebbe limitarsi all'aiuto umanitario e non fornire armi a nessuno."],[75,"Spetta all'Ucraina decidere se e a quali condizioni negoziare."],[76,"Per arrivare alla pace l'Ucraina dovrebbe accettare cessioni territoriali alla Russia."],[77,"Una pace che lasci alla Russia i territori conquistati è inaccettabile."],[78,"I beni russi congelati nelle banche occidentali dovrebbero essere usati per sostenere l'Ucraina."],[79,"Le sanzioni alla Russia andrebbero riviste o allentate."],[80,"L'Ucraina dovrebbe entrare nella NATO."],[81,"Dopo un accordo di pace, truppe europee, anche italiane, dovrebbero essere schierate in Ucraina come garanzia di sicurezza."],[82,"L'Italia dovrebbe aumentare significativamente la spesa per la difesa, anche con il 3-5% del PIL."],[83,"La spesa per le armi dovrebbe diminuire a favore di sanità, scuola e welfare."],[84,"L'Italia dovrebbe reintrodurre una forma di servizio militare o civile obbligatorio."],[85,"Il nostro Paese dovrebbe avere una propria industria della difesa forte, anche con un'integrazione europea."],[86,"L'Italia dovrebbe riconoscere il diritto di Israele a difendersi da attacchi armati, nel rispetto del diritto internazionale umanitario."],[87,"L'Italia dovrebbe riconoscere lo Stato di Palestina anche in assenza di un accordo definitivo con Israele."],[88,"L'Italia dovrebbe interrompere la vendita di armi a paesi coinvolti in conflitti con gravi violazioni dei diritti umani."]]},{"t":"6. Stati Uniti, NATO, Cina, Russia e rapporti internazionali","q":[[89,"La NATO e l'alleanza con gli Stati Uniti restano il pilastro della sicurezza italiana."],[90,"L'Italia dovrebbe puntare a un'autonomia strategica europea, meno dipendente dagli Stati Uniti."],[91,"Gli Stati Uniti sono oggi un alleato meno affidabile di prima."],[92,"L'Italia dovrebbe assecondare le richieste americane su spesa militare e commercio per mantenere buoni rapporti."],[93,"I dazi americani sui prodotti europei vanno contrastati con misure di reciprocità, anche a costo di una guerra commerciale."],[94,"Per l'Italia è preferibile trattare da sola con Washington piuttosto che fidarsi della trattativa europea."],[95,"Le grandi piattaforme tecnologiche americane hanno troppo potere e vanno tassate e regolate duramente, anche a costo di tensioni con gli USA."],[96,"Le basi militari americane in Italia sono una garanzia di sicurezza e vanno mantenute."],[97,"La presenza di armi nucleari statunitensi nelle basi europee, comprese quelle italiane, dovrebbe essere mantenuta."],[98,"L'Italia dovrebbe avere rapporti commerciali più stretti con la Cina."],[99,"La Cina rappresenta una minaccia economica e strategica da cui l'Italia deve difendersi (investimenti, tecnologie, infrastrutture)."],[100,"Con la Russia andrebbe ripristinato un dialogo normale non appena la guerra finisce."],[101,"Il mondo si sta dividendo in blocchi, e l'Italia deve schierarsi chiaramente con l'Occidente."],[102,"L'Italia dovrebbe puntare di più su rapporti con Africa, Medio Oriente e Mediterraneo (Piano Mattei)."]]},{"t":"7. Immigrazione, sicurezza e cittadinanza","q":[[103,"Lo Stato dovrebbe aumentare i controlli alle frontiere per ridurre gli ingressi irregolari."],[104,"L'Italia dovrebbe aprire più canali legali di ingresso per lavoro."],[105,"L'Italia dovrebbe poter trasferire in paesi terzi le procedure di asilo per chi arriva irregolarmente."],[106,"Il salvataggio in mare è un dovere assoluto e le navi delle ONG non vanno ostacolate."],[107,"Le ONG nel Mediterraneo dovrebbero essere soggette a regole più stringenti."],[108,"Una persona nata in Italia da genitori stranieri dovrebbe poter ottenere la cittadinanza prima dei 18 anni, se soddisfa requisiti stabiliti per legge."],[109,"La cittadinanza dovrebbe essere trasmessa soprattutto per discendenza."],[110,"I discendenti di italiani all'estero dovrebbero ottenere la cittadinanza più difficilmente di oggi."],[111,"L'Italia dovrebbe accogliere più immigrati per sostenere economia e pensioni."],[112,"Gli immigrati che commettono reati dovrebbero essere espulsi più rapidamente."],[113,"Chi vive in Italia deve rispettare le leggi del Paese, nel quadro dei diritti e delle libertà costituzionali."],[114,"Una società multiculturale arricchisce il Paese."],[115,"Per la sicurezza servono pene più severe e più poteri alle forze dell'ordine."],[116,"Le forze dell'ordine dovrebbero poter usare il riconoscimento facciale in luoghi pubblici per prevenire o indagare reati gravi, con garanzie e limiti stabiliti per legge."],[117,"La funzione principale del carcere dovrebbe essere il reinserimento."],[118,"Chi si difende da una aggressione in casa dovrebbe avere più tutele legali (legittima difesa allargata)."],[208,"Chi lavora regolarmente in Italia da anni dovrebbe poter regolarizzare la propria posizione."],[209,"I richiedenti asilo dovrebbero poter lavorare fin dai primi mesi."],[210,"I centri di permanenza per il rimpatrio (Cpr) andrebbero chiusi."]]},{"t":"8. Diritti civili, laicità, famiglia e valori","q":[[119,"Lo Stato dovrebbe riconoscere pienamente i diritti delle coppie omosessuali, compreso il matrimonio."],[120,"Le coppie omosessuali dovrebbero poter adottare figli."],[121,"La legge italiana dovrebbe punire i cittadini che ricorrono alla gestazione per altri all'estero, anche quando è legale nel Paese in cui avviene."],[122,"Il fine vita (eutanasia, suicidio assistito) dovrebbe essere una scelta individuale regolata dalla legge."],[123,"L'aborto dovrebbe restare un diritto garantito."],[124,"Le associazioni pro vita dovrebbero poter offrire consulenza nei consultori pubblici, senza ostacolare l'accesso ai servizi previsti dalla legge."],[125,"I valori della tradizione e della famiglia, anche di matrice cattolica, dovrebbero avere un peso nelle leggi dello Stato."],[126,"La famiglia fondata sul matrimonio tra uomo e donna merita una tutela speciale."],[127,"Le istituzioni italiane dovrebbero ridurre il peso delle posizioni ufficiali della Chiesa cattolica nelle decisioni politiche."],[128,"Il crocifisso dovrebbe poter restare nelle aule scolastiche e negli uffici pubblici."],[129,"L'insegnamento della religione cattolica dovrebbe essere facoltativo e collocato fuori dall'orario scolastico ordinario."],[130,"La cannabis dovrebbe essere legalizzata."],[131,"Le droghe pesanti vanno trattate soprattutto come un problema sanitario, non penale."],[132,"La legge dovrebbe prevedere sanzioni più severe per le discriminazioni e le minacce motivate da omotransfobia."],[133,"Il cambio di nome e di genere sui documenti dovrebbe essere più semplice."],[134,"Le scuole dovrebbero poter offrire educazione sessuale e affettiva senza il consenso preventivo dei genitori."],[135,"Le quote di genere (donne nei consigli di amministrazione, nelle liste elettorali) sono utili."],[136,"Il linguaggio politicamente corretto sta limitando la libertà di espressione."],[137,"Il femminicidio dovrebbe essere introdotto come reato autonomo, con una definizione e pene stabilite dalla legge."],[138,"Lo Stato dovrebbe essere più neutrale in materia religiosa di quanto sia oggi."]]},{"t":"9. Ambiente, energia e territorio","q":[[139,"L'Italia dovrebbe fissare obiettivi vincolanti e più ambiziosi per ridurre le emissioni, anche se comportano costi nel breve periodo."],[140,"Il nucleare dovrebbe tornare a far parte del mix energetico italiano."],[141,"L'Italia dovrebbe puntare soprattutto su solare ed eolico, anche con impianti più grandi sul territorio."],[142,"La tutela del paesaggio dovrebbe avere la precedenza sugli impianti eolici e solari."],[143,"L'obiettivo europeo di cessare la vendita di nuove auto a combustione dal 2035 dovrebbe essere rivisto o rinviato."],[144,"Il gas resta una fonte necessaria e l'Italia dovrebbe estrarne di più nei propri mari."],[145,"Gli incentivi pubblici per auto elettriche, pannelli solari e ristrutturazioni energetiche vanno aumentati."],[146,"Per ridurre le emissioni, il governo dovrebbe vietare o limitare alcune attività ad alta intensità di carbonio e abitudini di consumo."],[147,"Le politiche climatiche europee sono troppo onerose per agricoltori e allevatori."],[148,"La tutela dell'ambiente giustifica limiti all'edilizia."],[149,"Il consumo di suolo va ridotto drasticamente."],[150,"I condoni edilizi sono accettabili per gli abusi di necessità."],[151,"Le grandi opere (TAV, ponti, autostrade) servono al Paese anche se contestate dai territori."],[152,"Il trasporto pubblico locale e le ferrovie dovrebbero ricevere più fondi rispetto alle strade."],[153,"La caccia e la pesca sportiva vanno limitate di più per tutelare la fauna."],[154,"Serve più prevenzione contro il dissesto idrogeologico, anche a costo di sottrarre risorse ad altre priorità."],[220,"Il Superbonus 110% è stato una misura giusta, nonostante il costo per lo Stato."],[221,"Per smaltire i rifiuti servono più termovalorizzatori."]]},{"t":"10. AI, tecnologia, privacy e media","q":[[155,"Le regole sull'intelligenza artificiale dovrebbero dare priorità alla tutela delle persone anche se rallentano lo sviluppo o l'adozione di alcune tecnologie."],[156,"Le regole europee sull'AI rischiano di far perdere all'Europa la corsa tecnologica contro USA e Cina."],[157,"L'AI porterà più benefici che danni all'economia e all'occupazione."],[158,"Le aziende che riducono l'occupazione sostituendo mansioni con l'intelligenza artificiale dovrebbero pagare un contributo specifico."],[159,"Serve un reddito di base universale per chi perderà il lavoro a causa dell'automazione."],[160,"I contenuti generati in misura sostanziale dall'intelligenza artificiale dovrebbero essere etichettati per legge."],[161,"L'addestramento dell'AI su opere protette dovrebbe essere consentito solo con una licenza che preveda autorizzazione e compenso agli autori."],[162,"L'AI nella pubblica amministrazione e nella sanità va sfruttata di più per ridurre tempi e costi."],[163,"Una decisione automatizzata che incide in modo significativo sui diritti di una persona dovrebbe poter essere riesaminata da un essere umano."],[164,"L'uso dell'AI a scuola e all'università va limitato per tutelare l'apprendimento."],[165,"Il rischio che l'AI superi il controllo umano è così serio da giustificare accordi internazionali vincolanti."],[166,"L'Europa dovrebbe costruire una propria infrastruttura AI e cloud con denaro pubblico."],[167,"Lo Stato dovrebbe sapere e poter usare i dati dei cittadini per migliorare i servizi, a condizione di garanzie."],[168,"Le autorità dovrebbero rispettare la riservatezza dei cittadini anche quando ciò rende più difficili alcune indagini, salvo eccezioni previste dalla legge."],[169,"Le piattaforme social dovrebbero rispondere legalmente se non rimuovono tempestivamente contenuti illeciti segnalati."],[170,"Le piattaforme social non dovrebbero poter rimuovere contenuti legali solo perché contrari alle proprie regole interne."],[171,"L'accesso ai social network dovrebbe essere vietato o limitato per i minori di 16 anni."],[172,"Lo Stato dovrebbe contrastare le campagne coordinate di disinformazione online con procedure trasparenti e indipendenti."],[173,"I cittadini dovrebbero poter usare liberamente le criptovalute, senza troppe restrizioni."],[174,"La RAI dovrebbe essere governata con regole che ne garantiscano l'indipendenza dai partiti e dal governo in carica."],[211,"Le aziende dovrebbero poter usare i dati personali per gli scopi autorizzati dall'utente senza ulteriori limiti specifici."],[212,"Lo Stato dovrebbe finanziare le startup di intelligenza artificiale con fondi pubblici."],[213,"L'uso del riconoscimento facciale da parte delle autorità negli spazi pubblici dovrebbe essere vietato."]]},{"t":"11. Mezzogiorno, memoria, identità e cultura","q":[[175,"Il Mezzogiorno ha bisogno di un grande piano di investimenti statali per colmare il divario con il Nord."],[176,"Il divario Nord-Sud dipende soprattutto dalle responsabilità delle classi dirigenti locali."],[177,"Serve una fiscalità di vantaggio (tasse più basse) per attrarre imprese e giovani al Sud."],[178,"Contro la criminalità organizzata sono giustificate misure eccezionali."],[179,"L'antifascismo deve rimanere un valore fondante e condiviso della Repubblica."],[180,"Nel valutare il fascismo, si dovrebbero considerare anche le politiche del regime che alcuni giudicano positive."],[181,"Le celebrazioni del 25 aprile andrebbero vissute come una festa di tutti e non di una parte politica."],[182,"Comunismo e fascismo vanno condannati allo stesso modo."],[183,"Gli anni di Piombo e il terrorismo di quegli anni meritano una memoria più condivisa e meno divisa."],[184,"La lingua italiana va tutelata dall'uso eccessivo di termini inglesi."],[185,"Il patrimonio culturale e artistico italiano dovrebbe essere finanziato soprattutto dallo Stato, anche a costo di sacrificare altro."],[187,"L'Italia dovrebbe essere più orgogliosa della propria identità nazionale e promuoverla di più."],[188,"Il patriottismo è un valore positivo."],[189,"Il calcio professionistico dovrebbe essere sottoposto a maggiori controlli pubblici sui conti e sulla governance."],[190,"La Costituzione dovrebbe rafforzare la tutela costituzionale dell'ambiente e degli ecosistemi."],[191,"I borghi e le aree interne vanno sostenuti con fondi pubblici anche se poco redditizi."],[192,"Gli italiani residenti all'estero dovrebbero avere una rappresentanza dedicata più ampia in Parlamento."]]},{"t":"12. Domande aperte e di priorità","q":[[193,"Quale tra tutti questi temi è per te decisivo, quello per cui non voteresti mai chi la pensa diversamente?"],[194,"Quali sono i tre problemi che, secondo te, l'Italia deve risolvere nei prossimi cinque anni?"],[195,"C'è una questione su cui ti sei accorto di aver cambiato idea negli ultimi anni? Quale e perché?"],[196,"Quale politico o leader, italiano o straniero, vivo o storico, senti più vicino al tuo modo di pensare?"],[197,"Quale politico o corrente senti più lontano da te, e cosa ti convince di meno?"],[198,"Ti senti rappresentato da un partito oggi? Se sì, quale e quanto? Se no, perché?"],[199,"In una situazione di conflitto tra libertà individuale e sicurezza collettiva, dove tracci tu il limite?"],[200,"Se potessi cambiare una sola legge o istituzione italiana domani mattina, quale sceglieresti?"]]}],"blurb":["Tasse, ruolo dello Stato, debito e grandi opere.","Lavoro, salari, pensioni, sanità e scuola.","Come si governa: premierato, autonomie, giustizia e libertà.","Sovranità, euro, regole e debito comune.","Armi, pace, spesa militare e Medio Oriente.","NATO, Stati Uniti, dazi, Cina e Russia.","Frontiere, cittadinanza, carcere e sicurezza.","Famiglia, fine vita, laicità e diritti.","Transizione ecologica, nucleare e territorio.","Intelligenza artificiale, privacy, social e media.","Divario Nord-Sud, memoria, identità e cultura.","Otto domande a risposta libera. Non entrano nel calcolo."],"axes":[{"id":"eco","n":"Economia e welfare","lo":"Meno tasse e meno spesa pubblica","hi":"Più tasse e più servizi pubblici","ml":"Meno tasse e spesa","mh":"Più tasse e servizi","p":[2,4,5,6,8,11,13,14,20,21,23,24,25,29,32,37,38,175,17,26,31,83,185,191,214,215,216,217,219],"m":[1,3,9,10,12,15,19,22,27,30,33,177,7,34,35,36,218]},{"id":"ist","n":"Istituzioni","lo":"Più contrappesi e mediazione","hi":"Decisioni più rapide e governo più forte","p":[39,40,42,49,51,52,53,54,45,55,56,205,206,223,224],"m":[41,43,57,58,44,50,174,207]},{"id":"cul","n":"Valori e diritti civili","lo":"Valori tradizionali come riferimento","hi":"Scelte individuali più ampie","ml":"Valori tradizionali","mh":"Scelte individuali","p":[119,120,122,123,127,129,130,131,132,133,135
