nanziamenti ai combustibili fossili."],"145":[5,5,"Programma PaP 2025 · energia","Propone investimenti nelle rinnovabili e incentivi energetici orientati all’equità sociale."],"146":[5,5,"Programma PaP 2025 · ambiente","Propone una transizione ecologica e la riduzione dei consumi anche con interventi pubblici incisivi."],"147":[1,1,"Programma PaP 2025 · ambiente","Sostiene investimenti e regole per la transizione ecologica, non il loro allentamento."],"148":[5,5,"Programma PaP 2025 · territorio","Propone di fermare il consumo di suolo e subordinare l’edilizia a criteri ambientali."],"149":[5,5,"Programma PaP 2025 · territorio","Propone di fermare il consumo di suolo e riqualificare il patrimonio edilizio esistente."],"152":[5,5,"Programma PaP 2025 · trasporti","Propone la rinazionalizzazione dei trasporti e investimenti nei servizi pubblici."],"154":[5,5,"Programma Unione Popolare 2022 (coalizione con PaP)","Il programma dà priorità alle opere di messa in sicurezza idrogeologica e alla cura del territorio."],"174":[5,5,"Programma Unione Popolare 2022 (coalizione con PaP)","Il programma propone una riforma della RAI che la sottragga alla dipendenza diretta del governo."],"175":[5,5,"Programma PaP 2025 · questione meridionale","Propone investimenti pubblici e contrasto ai tagli che aggravano il divario territoriale."],"179":[5,5,"Programma PaP 2025 · istituzioni e memoria","Il programma richiama i principi repubblicani, democratici e antifascisti."],"180":[1,1,"Programma elettorale PaP 2018","Il programma si definisce democratico e antifascista e richiama la Resistenza come fondamento costituzionale."],"182":[1,1,"Programma elettorale PaP 2018","Il programma si definisce comunista e socialista e non equipara la propria tradizione politica al fascismo."],"185":[5,5,"Programma PaP 2025 · cultura","Considera la cultura un diritto e propone finanziamenti pubblici per renderla accessibile."],"191":[5,5,"Programma PaP 2025 · questione meridionale","Propone interventi pubblici e sostegno alle aree interne e ai territori in abbandono."],"205":[1,1,"Programma PaP 2025 · istituzioni","Denuncia l’abuso dei decreti e la riduzione del Parlamento a ratifica di decisioni già prese."],"210":[5,5,"Programma PaP 2025 · migrazioni","Propone di superare le strutture di detenzione amministrativa per le persone migranti."],"211":[1,1,"Programma PaP 2025 · privacy e diritti digitali","Si oppone alla mercificazione dei dati e rivendica il rafforzamento della riservatezza."],"213":[5,5,"Programma PaP 2025 · privacy e diritti digitali","Propone di contrastare il riconoscimento biometrico in tempo reale e la sorveglianza di massa."],"214":[5,5,"Programma PaP 2025 · diritto alla casa","Propone edilizia residenziale pubblica, calmieramento dei canoni e un tetto agli affitti."],"215":[5,5,"Programma PaP 2025 · diritto alla casa","Propone limiti spaziali e temporali alle locazioni brevi turistiche."],"216":[5,5,"Programma PaP 2025 · sicurezza sul lavoro","Propone più ispettori, controlli senza preavviso e sanzioni severe per le morti sul lavoro."],"218":[1,1,"Programma PaP 2025 · lavoro e diritti sindacali","Propone di abrogare le norme anti-sciopero e rafforzare i diritti sindacali."]},"glyph":"<svg viewBox=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M7 1L13 4.5V9.5L7 13L1 9.5V4.5Z\" fill=\"var(--pap)\"/><\/svg>"}],"guide":{"keys":["eco","work","inst","eu","war","world","migration","rights","environment","technology","south"],"work":{"19":{"what":"Il mercato del lavoro deve essere più flessibile, anche se significa meno tutele rigide.","agree":"La flessibilità può aiutare le imprese ad adattarsi ai cambiamenti e assumere, e può rendere più semplice l’accesso al lavoro per chi cerca una prima opportunità.","disagree":"Tutele solide possono proteggere reddito e stabilità dei lavoratori e impedire che l’incertezza venga scaricata soprattutto su chi ha meno potere contrattuale."},"20":{"what":"Va introdotto un salario minimo per legge.","agree":"Una soglia legale può tutelare chi riceve paghe molto basse e offrire una protezione comune anche a chi ha poca forza negoziale.","disagree":"Un’unica soglia potrebbe non adattarsi a settori e territori diversi e aumentare i costi per alcune imprese. Si può preferire rafforzare la contrattazione collettiva."},"21":{"what":"Misure di sostegno al reddito come l'ex reddito di cittadinanza sono giuste e necessarie contro la povertà.","agree":"Un sostegno al reddito può evitare povertà estrema e garantire una rete di sicurezza quando mancano lavoro o altre risorse.","disagree":"Si possono temere costi elevati, controlli difficili o incentivi insufficienti a cercare un lavoro, e preferire aiuti più mirati o legati a percorsi di formazione e inserimento."},"22":{"what":"Chi può lavorare e rifiuta offerte di lavoro dovrebbe perdere ogni sussidio.","agree":"Si può considerare il sostegno pubblico legato alla disponibilità a cercare un impiego e ritenere necessarie conseguenze per rifiuti non giustificati.","disagree":"Non tutte le offerte sono adatte o compatibili con salute, cura familiare, distanza o condizioni di lavoro. Togliere ogni aiuto può aggravare la povertà senza risolvere gli ostacoli all’occupazione."},"23":{"what":"Servirebbe la settimana lavorativa di quattro giorni a parità di stipendio.","agree":"Una settimana più corta può migliorare il benessere e la conciliazione vita-lavoro e, in alcune attività, favorire produttività e concentrazione.","disagree":"Mantenere la stessa retribuzione con meno ore può aumentare costi o carichi, soprattutto nei servizi che richiedono copertura continua. I risultati possono variare molto tra settori."},"24":{"what":"Il lavoro precario e i contratti a termine vanno limitati per legge.","agree":"Limitare l’uso ripetuto di contratti temporanei può favorire stabilità, pianificazione della vita e investimenti nella formazione dei lavoratori.","disagree":"Contratti flessibili possono aiutare imprese e lavoratori a gestire attività stagionali o incerte. Limiti rigidi potrebbero ridurre assunzioni o spingere verso forme di lavoro meno tutelate."},"25":{"what":"I sindacati hanno ancora un ruolo importante e andrebbero rafforzati.","agree":"I sindacati possono riequilibrare il potere tra lavoratori e datori di lavoro e negoziare salari, sicurezza e condizioni comuni.","disagree":"Si può ritenere che alcune organizzazioni rappresentino solo una parte dei lavoratori o rendano più difficile adattare regole e contratti alle differenze tra imprese e settori."},"26":{"what":"L'età della pensione non dovrebbe salire ulteriormente, nemmeno con l'aumento dell'aspettativa di vita.","agree":"Un’età pensionabile stabile può offrire certezza e proteggere chi svolge lavori gravosi o ha iniziato presto a lavorare.","disagree":"Se si vive più a lungo, mantenere invariata l’età di pensionamento può aumentare la spesa e il peso su chi lavora. Si può preferire collegare gradualmente le regole alla sostenibilità del sistema."},"27":{"what":"Il sistema pensionistico dovrebbe dare più peso ai fondi privati e meno alla previdenza pubblica.","agree":"La previdenza complementare può diversificare le fonti di reddito in vecchiaia e lasciare più spazio alle scelte individuali e al risparmio personale.","disagree":"La pensione pubblica offre una protezione collettiva e meno dipendente dai risultati dei mercati. Dare più peso ai fondi privati può aumentare le differenze tra chi può risparmiare e chi no."},"28":{"what":"I giovani sono penalizzati dal sistema attuale a favore dei pensionati e delle generazioni più anziane.","agree":"Si può ritenere che regole e spesa concentrino risorse sulle generazioni anziane, mentre molti giovani affrontano salari bassi e carriere discontinue.","disagree":"Le differenze tra generazioni non dipendono solo dalle pensioni e gli anziani hanno versato contributi e possono avere bisogni maggiori. Si può temere che contrapporre i gruppi nasconda disuguaglianze interne a ciascuna generazione."},"29":{"what":"La sanità dovrebbe essere gestita soprattutto dallo Stato, non da privati.","agree":"Una gestione prevalentemente pubblica può sostenere l’universalità delle cure e ridurre il rischio che l’accesso dipenda dal reddito o dalla convenienza economica.","disagree":"Strutture private possono offrire capacità aggiuntiva, specializzazioni o modalità organizzative diverse. Si può preferire un sistema misto purché qualità e accesso siano regolati."},"30":{"what":"Per ridurre le liste d'attesa è giusto affidarsi di più alle strutture private convenzionate.","agree":"Le strutture convenzionate possono ampliare rapidamente i posti disponibili e offrire un’alternativa quando il servizio pubblico non riesce a garantire tempi adeguati.","disagree":"Si può temere che fondi e personale si spostino dal pubblico al privato senza risolvere le cause delle liste, o che l’accesso resti diseguale tra prestazioni e territori."},"31":{"what":"Il medico di base e la sanità territoriale vanno riformati profondamente.","agree":"Servizi territoriali meglio coordinati possono seguire le persone vicino a casa, prevenire aggravamenti e ridurre accessi evitabili agli ospedali.","disagree":"Riforme ampie possono creare discontinuità e nuovi carichi senza risolvere carenze di personale o organizzazione. Si può preferire intervenire con cambiamenti graduali e verificabili."},"32":{"what":"La scuola pubblica dovrebbe ricevere molte più risorse, anche a scapito di altri settori.","agree":"Più risorse possono migliorare ambienti, sostegno agli studenti e condizioni di insegnamento, con benefici per opportunità e competenze future.","disagree":"Le risorse pubbliche sono limitate e aumentare la spesa scolastica comporta rinunce in altri ambiti. Si può chiedere prima di usare meglio i fondi esistenti o di stabilire priorità specifiche."},"33":{"what":"Le scuole paritarie private dovrebbero ricevere finanziamenti pubblici.","agree":"Il finanziamento può sostenere la libertà di scelta delle famiglie e riconoscere il contributo di scuole che svolgono un servizio educativo.","disagree":"Si può ritenere che i fondi pubblici debbano concentrarsi sulla scuola statale e temere che sovvenzionare istituti privati riduca risorse o controllo democratico sul sistema comune."},"34":{"what":"Gli studenti dovrebbero essere valutati e selezionati di più in base al merito, fin dalle scuole superiori.","agree":"Valutazioni chiare e aspettative elevate possono riconoscere impegno e risultati e aiutare gli studenti a seguire percorsi adatti alle proprie capacità.","disagree":"Selezioni precoci possono risentire delle condizioni familiari e delle opportunità di partenza, consolidando svantaggi. Si può preferire sostenere gli studenti prima di separarli in percorsi diversi."},"35":{"what":"Gli insegnanti dovrebbero essere pagati in base ai risultati e non solo all'anzianità.","agree":"Premiare competenze e contributi può riconoscere il lavoro svolto e incentivare formazione e miglioramento dell’insegnamento.","disagree":"Misurare i risultati individuali a scuola è difficile: dipendono anche da contesto e collaborazione. Indicatori semplici potrebbero premiare ciò che si misura e trascurare aspetti importanti dell’educazione."},"36":{"what":"L'università dovrebbe essere molto più legata alle esigenze delle imprese.","agree":"Un rapporto più stretto con le imprese può facilitare l’ingresso nel lavoro, orientare alcune competenze e sostenere ricerca e innovazione.","disagree":"L’università ha anche il compito di sviluppare conoscenze e capacità non legate a bisogni immediati delle aziende. Un’eccessiva dipendenza da interessi economici può ridurre autonomia e varietà degli studi."},"37":{"what":"Le tasse universitarie dovrebbero essere abolite o ridotte al minimo.","agree":"Tasse basse possono rendere l’università accessibile a più persone e limitare il rischio che il costo impedisca di proseguire gli studi.","disagree":"L’abolizione generalizzata richiede risorse pubbliche e può destinare aiuti anche a famiglie che potrebbero contribuire. Si può preferire ridurre le tasse soprattutto per chi ha redditi più bassi."},"38":{"what":"Lo Stato dovrebbe sostenere economicamente le famiglie che fanno figli, anche con forti incentivi alla natalità.","agree":"Aiuti economici e servizi possono ridurre i costi di crescere figli e dare alle famiglie maggiore libertà di scelta e sicurezza.","disagree":"Gli incentivi economici da soli potrebbero non cambiare le decisioni e comportano costi pubblici. Si può preferire investire in casa, servizi per l’infanzia e conciliazione, senza orientare le scelte familiari."},"216":{"what":"Contro le morti sul lavoro servono controlli e sanzioni molto più severi.","agree":"Controlli credibili e conseguenze adeguate possono incentivare il rispetto delle norme e proteggere la vita e la salute dei lavoratori.","disagree":"Regole e sanzioni esistenti potrebbero essere già sufficienti se applicate con costanza. Si può dare priorità a prevenzione, formazione e ispezioni mirate, temendo che sanzioni più dure da sole non evitino gli incidenti."},"218":{"what":"Il diritto di sciopero nei servizi essenziali (trasporti, sanità) va limitato.","agree":"Limitazioni e servizi minimi possono tutelare persone che dipendono da trasporti e cure e ridurre disagi per chi non ha alternative.","disagree":"Il diritto di sciopero è uno strumento di tutela dei lavoratori e limitarlo può indebolire la loro capacità di negoziare. Si possono preferire accordi sui servizi minimi e procedure di conciliazione."},"219":{"what":"Se la misura di sostegno al reddito introdotta nel 2019 vada reintrodotta com'era, e non solo rivista o sostituita.","agree":"Un sostegno universale e senza troppi vincoli può proteggere chi è in povertà assoluta e dare una rete di sicurezza immediata, anche se non trova subito lavoro.","disagree":"Si può ritenere che la misura originaria scoraggiasse la ricerca di lavoro e avesse controlli deboli. Si può preferire un sostegno più legato a formazione e inserimento lavorativo."}},"inst":{"39":{"what":"Il modo in cui si forma il governo e il peso che gli elettori hanno nella scelta del capo dell’esecutivo.","agree":"Si può ritenere che l’elezione diretta dia al governo un mandato chiaro e renda più semplice attribuire responsabilità e meriti.","disagree":"Si può temere che concentri troppo potere in una sola carica e riduca il ruolo del Parlamento, delle minoranze e dei controlli costituzionali."},"40":{"what":"La forma di governo: un presidente eletto direttamente esercita poteri esecutivi propri, oltre alla scelta diretta del capo del governo.","agree":"Un presidente eletto dal popolo può garantire stabilità e una guida riconoscibile, soprattutto nei momenti di crisi.","disagree":"Un sistema presidenziale può indebolire la mediazione parlamentare e creare conflitti tra poteri eletti con mandati contrapposti."},"41":{"what":"Il bilanciamento tra centralità del Parlamento e rapidità o stabilità dell’azione di governo.","agree":"Il Parlamento rappresenta in modo plurale gli elettori e può controllare l’esecutivo; governi meno stabili possono essere un costo accettabile per mantenere questo equilibrio.","disagree":"Governi che cambiano spesso possono rendere difficile attuare programmi e affrontare emergenze; si può preferire un esecutivo più stabile."},"42":{"what":"Se la legge elettorale debba privilegiare un risultato di governo certo, anche assegnando un premio di maggioranza.","agree":"Un vincitore riconoscibile può rendere più chiaro chi governa e chi risponde delle decisioni.","disagree":"Un premio può attribuire molti seggi a una forza che ha ottenuto una quota limitata di voti e ridurre la rappresentanza delle altre."},"43":{"what":"La proporzionalità tra voti ricevuti e seggi, anche quando può rendere più complessa la formazione del governo.","agree":"Un sistema proporzionale può rappresentare meglio la pluralità delle opinioni e ridurre il numero di voti senza rappresentanza.","disagree":"La frammentazione può rendere più difficile formare maggioranze e mantenere governi duraturi; si può preferire un sistema che favorisca coalizioni più chiare."},"44":{"what":"Quanto gli elettori debbano poter scegliere i singoli candidati invece di votare liste determinate dai partiti.","agree":"Le preferenze possono aumentare il legame tra eletto e territorio e permettere agli elettori di premiare o bocciare candidati specifici.","disagree":"Le preferenze possono alimentare competizione personale, campagne costose e reti clientelari; liste definite con criteri trasparenti possono valorizzare programmi e squadra."},"45":{"what":"Se ridurre ancora il numero dei parlamentari migliori il funzionamento delle Camere o impoverisca la rappresentanza.","agree":"Meno parlamentari possono ridurre costi e rendere le assemblee più snelle.","disagree":"Un numero più basso può rendere più difficile rappresentare territori e gruppi diversi e aumentare il peso di ciascun eletto o dei vertici di partito."},"46":{"what":"La distribuzione delle competenze tra Stato e Regioni, in particolare per servizi essenziali come sanità e istruzione.","agree":"Le Regioni possono adattare le politiche alle condizioni locali e avvicinare le decisioni ai cittadini.","disagree":"Competenze diverse possono creare disuguaglianze nei diritti e nei servizi; standard nazionali comuni possono garantire tutele indipendentemente dal luogo di residenza."},"47":{"what":"Il rischio che l’autonomia differenziata allarghi le differenze tra territori con risorse e capacità amministrative diverse.","agree":"Se competenze e risorse vengono trasferite senza garanzie uniformi, i territori più forti potrebbero offrire servizi migliori e attrarre ulteriori risorse.","disagree":"Autonomie accompagnate da livelli essenziali e perequazione possono riconoscere differenze locali senza necessariamente aumentare le disuguaglianze."},"48":{"what":"Il ruolo delle Province e degli enti intermedi tra Comuni e Regioni.","agree":"Eliminarli o ridurli può evitare sovrapposizioni e spese amministrative e chiarire chi è responsabile delle decisioni.","disagree":"Gli enti intermedi possono coordinare servizi e infrastrutture che superano i confini comunali; eliminarli può allontanare alcune funzioni dai territori."},"49":{"what":"Se il Senato debba rappresentare soprattutto le autonomie territoriali e avere poteri diversi dalla Camera.","agree":"Una camera delle autonomie può dare voce alle Regioni e ridurre la duplicazione dei passaggi legislativi.","disagree":"Ridurre i poteri di una Camera può indebolire il controllo parlamentare o complicare la responsabilità politica; il bicameralismo può essere mantenuto o riformato senza cambiare la rappresentanza."},"50":{"what":"Quanto sia opportuno facilitare referendum e altri strumenti di decisione diretta.","agree":"Soglie più accessibili possono permettere ai cittadini di portare temi all’attenzione pubblica e controllare le istituzioni tra un’elezione e l’altra.","disagree":"Referendum frequenti o formulati su questioni complesse possono comprimere il confronto e i diritti delle minoranze; servono procedure chiare e informazione adeguata."},"51":{"what":"Se la burocrazia sia il principale freno allo sviluppo e se vada ridotta drasticamente.","agree":"Regole e passaggi ridondanti possono rallentare servizi, investimenti e attività quotidiane; semplificarli può rendere la pubblica amministrazione più accessibile.","disagree":"La burocrazia comprende anche garanzie, controlli e procedure di imparzialità; tagli drastici possono ridurre tutele senza risolvere carenze di personale o organizzazione."},"52":{"what":"Le tutele e le procedure per rimuovere dipendenti pubblici con prestazioni insufficienti.","agree":"Procedure più efficaci possono rendere la pubblica amministrazione responsabile verso i cittadini e affrontare casi di inadempienza persistente.","disagree":"Licenziamenti più facili possono esporre i dipendenti a pressioni politiche o valutazioni arbitrarie; servono criteri verificabili, contraddittorio e formazione."},"53":{"what":"La separazione dei percorsi professionali di giudici e pubblici ministeri.","agree":"Percorsi distinti possono rafforzare la percezione di imparzialità e ridurre il rischio che chi accusa e chi giudica condividano la stessa carriera.","disagree":"La formazione comune e la possibilità di cambiare funzione possono favorire una cultura giuridica equilibrata; la riforma può inoltre modificare gli equilibri tra procura, giudici e politica."},"54":{"what":"Il grado di controllo politico sui magistrati e l’equilibrio tra responsabilità e indipendenza della giustizia.","agree":"Un controllo più forte può apparire necessario per rendere i magistrati responsabili delle loro decisioni e limitare abusi o inefficienze.","disagree":"L’indipendenza protegge le indagini e le decisioni giudiziarie da interferenze di chi governa; controlli impropri possono compromettere l’uguaglianza davanti alla legge."},"55":{"what":"Il compromesso tra durata dei processi e garanzie procedurali per chi è coinvolto.","agree":"Alcune procedure possono essere semplificate per ridurre ritardi, costi e incertezza, mantenendo il nucleo del diritto di difesa.","disagree":"Le garanzie servono a prevenire errori e decisioni ingiuste; i ritardi possono dipendere anche da carenza di personale, organizzazione e risorse."},"56":{"what":"L’utilità delle intercettazioni nelle indagini e i limiti necessari a proteggere la riservatezza.","agree":"Le intercettazioni possono fornire prove importanti nei reati gravi e aiutare a ricostruire reti e responsabilità difficili da accertare altrimenti.","disagree":"Possono coinvolgere persone estranee e diffondere informazioni private; si può chiedere che siano mirate, autorizzate e conservate con limiti rigorosi."},"57":{"what":"Il rispetto della presunzione d’innocenza anche quando una persona indagata svolge un ruolo politico.","agree":"La presunzione d’innocenza è una garanzia individuale che vale per tutti e impedisce di trattare un’indagine come una condanna.","disagree":"Chi ricopre incarichi pubblici può essere sottoposto a maggiore trasparenza e valutazioni politiche; ciò non equivale però a una condanna penale."},"58":{"what":"Se la Costituzione del 1948 debba essere cambiata raramente e con particolare cautela.","agree":"La Costituzione stabilisce diritti e limiti al potere; modificarla con cautela può proteggere stabilità e consenso ampio.","disagree":"Nuovi problemi e istituzioni possono richiedere aggiornamenti; anche una Costituzione importante può essere riformata con procedure rigorose e partecipazione pubblica."},"205":{"what":"Quanto il governo debba poter usare più facilmente decreti-legge nelle situazioni urgenti.","agree":"Tempi rapidi possono aiutare a rispondere a crisi che richiedono decisioni immediate.","disagree":"Un uso frequente dei decreti può ridurre il tempo per il dibattito e il controllo parlamentare; l’urgenza dovrebbe restare eccezionale e motivata."},"206":{"what":"Il rapporto tra le decisioni della Corte costituzionale e quelle del Parlamento.","agree":"Si può ritenere che le decisioni delle istituzioni elette debbano avere ampio spazio nel definire le politiche pubbliche.","disagree":"La Corte controlla che le leggi rispettino la Costituzione e i diritti fondamentali; questo limite tutela anche i cittadini quando una maggioranza eccede i propri poteri."},"207":{"what":"Se autorità indipendenti come il Garante per la privacy e l’ANAC debbano poter controllare più incisivamente il governo.","agree":"Poteri di controllo maggiori possono prevenire abusi, conflitti d’interesse e violazioni dei diritti anche quando riguardano l’esecutivo.","disagree":"Autorità non elette con poteri ampi possono ridurre la responsabilità politica; controlli efficaci richiedono competenze chiare, indipendenza e rendicontazione."},"222":{"what":"Se esista un tetto al numero di mandati elettivi, per favorire il ricambio della classe politica.","agree":"Un limite favorisce il ricambio, riduce le rendite di posizione e avvicina la politica ai cittadini.","disagree":"Un limite fa perdere esperienza e competenze, e toglie agli elettori la libertà di riconfermare chi ritengono bravo."},"223":{"what":"Il modo in cui un governo può cadere: con un semplice voto contrario o solo se il Parlamento indica subito un successore.","agree":"Obbliga le opposizioni a presentare un'alternativa e rende più difficili i ribaltoni e le crisi al buio, a vantaggio della stabilità.","disagree":"Può tenere in vita un governo debole e ridurre la capacità del Parlamento di far valere la fiducia o la sfiducia."},"224":{"what":"Se un magistrato possa essere chiamato a risarcire personalmente un errore, oltre allo Stato.","agree":"La responsabilità diretta rende più attento chi decide e offre un risarcimento più sicuro a chi subisce un errore grave.","disagree":"Si può temere che il rischio personale condizioni l'indipendenza dei giudici e favorisca cause pretestuose; si può preferire la responsabilità dello Stato e le sanzioni disciplinari."}},"eu":{"59":{"what":"Il livello di competenze e decisioni che dovrebbe essere affidato all’Unione Europea invece che agli Stati.","agree":"Competenze comuni possono aiutare ad affrontare problemi transnazionali e ridurre differenze tra paesi.","disagree":"Decisioni più vicine agli elettori nazionali possono riflettere meglio condizioni locali e mantenere più controllo democratico diretto."},"60":{"what":"Quanta autonomia dovrebbe conservare l’Italia rispetto alle decisioni prese a livello europeo.","agree":"Maggiore autonomia può consentire di adattare le politiche a priorità nazionali e correggere regole ritenute inadatte.","disagree":"Regole condivise possono limitare competizione al ribasso e rendere più efficace l’azione comune in un mercato integrato."},"61":{"what":"Il bilancio complessivo dei vantaggi e degli svantaggi dell’appartenenza italiana all’UE.","agree":"Il mercato comune, la cooperazione e la libertà di circolazione possono offrire opportunità economiche e sociali.","disagree":"I vincoli comuni e le differenze di peso tra paesi possono limitare scelte nazionali o distribuire vantaggi e costi in modo diseguale."},"62":{"what":"La valutazione dell’euro rispetto alle alternative monetarie per l’Italia.","agree":"Una moneta comune elimina il rischio di cambio nell’area e facilita scambi, viaggi e confronti di prezzo.","disagree":"Una moneta nazionale consentirebbe politiche monetarie e di cambio più adatte all’economia italiana; la moneta unica può limitare alcuni strumenti di risposta."},"63":{"what":"Se l’Italia starebbe meglio recuperando una moneta propria.","agree":"Una valuta nazionale potrebbe permettere di adeguare cambio e tassi alla situazione economica italiana.","disagree":"L’uscita potrebbe comportare incertezza su debiti e risparmi, costi di conversione e instabilità nei rapporti commerciali."},"64":{"what":"La flessibilità delle regole europee sui disavanzi e sul debito pubblico.","agree":"Regole meno rigide possono lasciare spazio a investimenti e stabilizzatori sociali durante crisi e recessioni.","disagree":"Limiti comuni possono contenere l’indebitamento e ridurre il rischio che i costi delle decisioni attuali ricadano sui contribuenti futuri."},"65":{"what":"L’emissione di debito comune europeo per finanziare investimenti condivisi.","agree":"Il debito comune può distribuire i costi tra paesi e finanziare beni pubblici che nessuno Stato riuscirebbe a realizzare da solo.","disagree":"Può creare responsabilità finanziarie condivise senza controllo equivalente sui bilanci nazionali e rendere meno chiaro chi decide la spesa."},"66":{"what":"La creazione di forze armate comuni dell’Unione Europea.","agree":"Un esercito comune potrebbe coordinare capacità e ridurre duplicazioni tra le forze nazionali.","disagree":"La difesa è legata a scelte costituzionali e strategiche nazionali; un esercito comune potrebbe aumentare la militarizzazione o allontanare il controllo dai cittadini."},"67":{"what":"Se le decisioni europee su politica estera e difesa debbano passare dall’unanimità alla maggioranza.","agree":"La maggioranza può evitare che un singolo governo blocchi ogni iniziativa comune e permettere risposte più rapide.","disagree":"L’unanimità tutela gli Stati più piccoli e impedisce che siano coinvolti in decisioni contrarie alla propria volontà."},"68":{"what":"Se allentare regole europee ambientali, agricole e automobilistiche per ridurne gli oneri.","agree":"Regole meno onerose possono dare tempo a imprese e agricoltori per adattarsi e limitare costi immediati per famiglie e settori produttivi.","disagree":"Standard comuni possono ridurre l’inquinamento e orientare investimenti di lungo periodo; arretrare può rinviare i costi ambientali e sanitari."},"69":{"what":"La condivisione obbligatoria tra paesi UE dell’accoglienza dei richiedenti asilo.","agree":"Una ripartizione comune può evitare che pochi paesi di frontiera gestiscano quasi da soli gli arrivi e migliorare la cooperazione.","disagree":"Quote obbligatorie possono non considerare capacità, preferenze e condizioni locali; si può preferire una solidarietà finanziaria o volontaria."},"70":{"what":"L’allargamento dell’UE a nuovi paesi, tra cui Balcani, Ucraina e Moldavia.","agree":"L’allargamento può sostenere stabilità, cooperazione e prospettive democratiche nei paesi candidati.","disagree":"Nuovi membri possono rendere più complessi i processi decisionali e richiedere riforme interne prima che l’Unione sia pronta."},"71":{"what":"Come rafforzare il peso negoziale dell’Italia nell’UE, anche collaborando con governi critici verso Bruxelles.","agree":"Alleanze tra Stati possono dare più influenza a priorità italiane e favorire modifiche a regole contestate.","disagree":"Intese costruite soprattutto contro le istituzioni comuni possono indebolire la cooperazione e rendere più difficile ottenere compromessi duraturi."},"72":{"what":"Il giudizio sull’uso italiano dei fondi e degli investimenti del PNRR.","agree":"Il piano può aver mobilitato risorse e progetti per infrastrutture, servizi e transizione, creando opportunità difficili da finanziare altrimenti.","disagree":"Ritardi, progetti poco efficaci o distribuzione iniqua possono significare che le risorse non abbiano prodotto i risultati attesi."},"201":{"what":"Se un governo nazionale possa non applicare regole UE che considera contrarie all’interesse del paese.","agree":"La possibilità di opporsi può tutelare priorità democratiche nazionali quando una regola comune produce danni rilevanti.","disagree":"Deroghe unilaterali possono rendere imprevedibili gli impegni comuni e indebolire la parità tra Stati membri."},"202":{"what":"Il rapporto tra le sentenze dei giudici europei e le leggi approvate in Italia.","agree":"Si può ritenere che le norme italiane debbano prevalere quando riflettono scelte democratiche e specificità costituzionali nazionali.","disagree":"Un sistema comune di diritti e obblighi richiede che le decisioni dei giudici europei siano rispettate dagli Stati che vi hanno aderito."},"203":{"what":"La quota italiana di contributo al bilancio comune dell’UE.","agree":"Versare meno può liberare risorse nazionali e apparire giusto se il paese ritiene di ricevere benefici inferiori al contributo.","disagree":"Il bilancio comune finanzia programmi e infrastrutture condivise; ridurre i contributi può limitare risorse anche per regioni e settori italiani."},"204":{"what":"Il peso del Parlamento europeo rispetto alla Commissione e ai governi nazionali.","agree":"Più potere parlamentare può rafforzare la rappresentanza diretta dei cittadini e il controllo pubblico sulle decisioni europee.","disagree":"Commissione e governi possono offrire continuità amministrativa e rappresentanza degli Stati; accentrare le decisioni nel Parlamento non risolve da solo la distanza dai cittadini."},"225":{"what":"Se l'Italia debba aderire al fondo europeo di stabilità riformato, la cui riforma l'Italia non ha ratificato nel voto della Camera del dicembre 2023.","agree":"La ratifica completa la rete di sicurezza europea per le crisi bancarie e finanziarie e riporta l'Italia in linea con gli altri Stati membri.","disagree":"Si può temere che il fondo imponga condizioni e rinunce di sovranità. Si può preferire non ratificare o ratificare solo con modifiche."}},"war":{"73":{"what":"Se l’Italia debba continuare a fornire armi all’Ucraina per sostenerne la difesa.","agree":"Gli aiuti militari possono aiutare un paese invaso a proteggere la popolazione e la propria sovranità.","disagree":"L’invio di armi può prolungare o intensificare il conflitto; si può preferire concentrarsi su assistenza umanitaria e diplomazia."},"74":{"what":"Se l’aiuto italiano ai paesi in guerra debba limitarsi all’assistenza umanitaria.","agree":"L’aiuto umanitario sostiene le persone colpite senza coinvolgere direttamente l’Italia nell’uso della forza.","disagree":"Un paese aggredito può avere bisogno di mezzi per difendersi; escludere ogni sostegno militare può ridurre la sua capacità di resistere."},"75":{"what":"Chi debba decidere condizioni e tempi di un negoziato tra Ucraina e Russia.","agree":"Lasciare la decisione all’Ucraina rispetta la sovranità del paese e impedisce ad altri di imporre concessioni alla sua popolazione.","disagree":"Un accordo richiede compromessi e mediazione internazionale; si può pensare che gli alleati debbano contribuire a definire condizioni sostenibili."},"76":{"what":"Se concessioni territoriali ucraine possano essere accettate per raggiungere la pace.","agree":"Una cessione può essere vista come un compromesso per fermare le morti e rendere possibile un accordo.","disagree":"Accettarla può legittimare conquiste ottenute con la forza e lasciare persone e territori sotto un’autorità non scelta."},"77":{"what":"Se una pace che lasci alla Russia territori conquistati sia inaccettabile.","agree":"Rifiutare l’annessione può difendere l’integrità territoriale e scoraggiare future aggressioni.","disagree":"Si può ritenere che una pace imperfetta sia preferibile alla prosecuzione della guerra, anche se lascia irrisolte alcune rivendicazioni territoriali."},"78":{"what":"L’uso dei beni russi congelati all’estero per sostenere l’Ucraina.","agree":"Le risorse dell’aggressore potrebbero contribuire alla difesa e alla ricostruzione del paese colpito.","disagree":"Confiscare beni sovrani può sollevare problemi giuridici e creare precedenti che incidono sulla fiducia nel sistema finanziario internazionale."},"79":{"what":"Se rivedere o allentare le sanzioni alla Russia possa favorire una soluzione diplomatica.","agree":"Ridurre le sanzioni può essere considerato un incentivo al dialogo e limitare i costi che ricadono anche su imprese e cittadini europei.","disagree":"Mantenere le sanzioni può esercitare pressione e segnalare che l’uso della forza comporta conseguenze; allentarle senza progressi può ridurne l’efficacia."},"80":{"what":"L’eventuale ingresso dell’Ucraina nella NATO.","agree":"L’adesione potrebbe offrire una garanzia collettiva di sicurezza e dissuadere future aggressioni.","disagree":"Può essere percepita come un’escalation e rendere più difficile una soluzione negoziata; si possono preferire garanzie di sicurezza diverse."},"81":{"what":"Lo schieramento di truppe europee, anche italiane, in Ucraina dopo un accordo di pace.","agree":"Una presenza internazionale può contribuire a monitorare l’accordo e ridurre il rischio di una nuova offensiva.","disagree":"Le truppe possono diventare parte del conflitto se l’accordo viene violato; una missione richiede mandato chiaro, consenso e valutazione dei rischi."},"82":{"what":"Un aumento consistente della spesa militare italiana, fino al 3–5% del PIL.","agree":"Più risorse possono rafforzare capacità difensive e contribuire agli impegni con gli alleati.","disagree":"Una quota così elevata può sottrarre fondi a sanità, scuola e welfare e alim fornitori stranieri.","Investimenti pubblici sono costosi e possono duplicare offerte private; occorrono governance aperta e criteri di utilità pubblica."],"167":["Usare dati in modo sicuro può migliorare servizi, coordinamento e allocazione delle risorse pubbliche.","La raccolta può estendersi oltre lo scopo iniziale e creare sorveglianza o fughe di dati; servono minimizzazione e controllo indipendente."],"168":["La riservatezza tutela diritti fondamentali e limita accessi indiscriminati alle informazioni personali.","Indagini gravi possono richiedere accessi mirati e autorizzati; regole troppo rigide possono ostacolare la prevenzione e l'accertamento dei reati."],"169":["Responsabilità per mancata rimozione di illeciti segnalati incentiva procedure rapide e tutela le persone danneggiate.","Responsabilità estesa può indurre rimozioni preventive di contenuti leciti; definizioni, ricorsi e valutazione giudiziaria sono importanti."],"170":["Proteggere contenuti legali da rimozioni arbitrarie salvaguarda espressione e pluralismo, soprattutto su temi controversi.","Le piattaforme hanno regole proprie per sicurezza e convivenza; l'obbligo assoluto può impedire interventi contro molestie lecite ma dannose."],"171":["Un limite d'età può ridurre esposizione a contenuti nocivi, pressione sociale e raccolta di dati sui minori.","Il divieto è difficile da applicare senza verifiche invasive e può limitare socialità e accesso a informazioni utili."],"172":["Interventi trasparenti contro reti coordinate possono ridurre manipolazioni e aiutare il pubblico a riconoscere fonti ingannevoli.","Il governo che definisce la disinformazione può censurare dissenso; servono criteri stretti, indipendenza e possibilità di ricorso."],"173":["Regole leggere possono favorire innovazione, autonomia finanziaria e nuovi sistemi di pagamento.","Controlli sono necessari contro frodi, riciclaggio e rischi per risparmiatori e stabilità finanziaria."],"174":["Regole di nomina indipendenti possono ridurre lottizzazione e rafforzare imparzialità e fiducia nel servizio pubblico.","L'indipendenza richiede anche responsabilità e pluralismo; modificare la governance non elimina automaticamente le pressioni politiche."],"175":["Investimenti pubblici possono colmare carenze di trasporti, servizi e opportunità che frenano lo sviluppo del Mezzogiorno.","Piani generici possono disperdere fondi o essere gestiti male; risultati, capacità amministrativa e priorità locali vanno valutati."],"176":["La qualità delle amministrazioni locali incide su servizi, uso dei fondi e condizioni per le imprese.","Attribuire il divario soprattutto alle classi dirigenti locali trascura storia, infrastrutture, investimenti nazionali e differenze strutturali."],"177":["Imposte più basse possono compensare svantaggi logistici e attrarre investimenti e posti di lavoro.","Gli incentivi possono spostare imprese senza creare sviluppo duraturo e ridurre entrate; contano infrastrutture, competenze e servizi."],"178":["Poteri investigativi e protezioni rafforzati possono contrastare organizzazioni violente e intimidazioni che limitano la vita civile.","Misure eccezionali vaghe possono erodere diritti e garanzie; strumenti ordinari efficaci e controlli giudiziari sono essenziali."],"179":["L'antifascismo richiama la nascita costituzionale della Repubblica e il rifiuto della dittatura e della violenza politica.","Si può temere che un valore condiviso venga usato come etichetta per escludere il dissenso democratico; il significato va discusso apertamente."],"180":["Esaminare anche politiche sociali o economiche aiuta a studiare il regime nella sua complessità storica.","Isolare misure considerate positive può minimizzare dittatura, repressione, guerra e persecuzioni; ogni giudizio deve mantenere il contesto complessivo."],"181":["Una celebrazione comune può riconoscere la Liberazione come fondamento civico della democrazia attuale.","L'idea di una festa condivisa non deve cancellare conflitti storici o imporre un'unica memoria delle esperienze familiari e politiche."],"182":["Condannare entrambi i totalitarismi sottolinea il rifiuto di violenza politica, repressione e soppressione del pluralismo.","L'equivalenza può cancellare differenze di ideologia, responsabilità storiche e scala dei crimini; confrontare non significa rendere identici."],"183":["Una memoria condivisa può riconoscere vittime diverse e favorire ricerca, verità e riconciliazione civile.","La riconciliazione non deve appiattire responsabilità o equiparare vittime e autori; documentazione e giustizia restano importanti."],"184":["Promuovere l'italiano può sostenere comprensione comune, patrimonio letterario e accessibilità dei servizi.","Le lingue cambiano naturalmente; criteri contro l'inglese possono essere arbitrari e ignorare prestiti utili o contesti internazionali."],"185":["Il finanziamento pubblico conserva beni comuni e rende accessibile il patrimonio anche dove non è redditizio.","Risorse limitate richiedono priorità e valutazione; affidarsi soprattutto allo Stato può sottrarre fondi ad altri bisogni o ridurre contributi privati."],"187":["Un'identità nazionale condivisa può sostenere solidarietà, partecipazione e conoscenza della storia comune.","Promuovere l'orgoglio nazionale può diventare esclusivo o nazionalista se non lascia spazio a identità plurali e critica."],"188":["Il patriottismo può esprimere cura per la comunità e responsabilità verso istituzioni e bene comune.","Può degenerare in nazionalismo e subordinare la critica o i diritti universali alla fedeltà nazionale."],"189":["Controlli su conti e governance possono tutelare tifosi, lavoratori e risorse pubbliche coinvolte nel settore.","Un controllo politico troppo diretto può minacciare autonomia sportiva e trasformarsi in interferenza nelle decisioni delle società."],"190":["Una tutela costituzionale più forte può dare continuità agli obblighi pubblici di conservazione ambientale.","Il principio deve tradursi in responsabilità e bilanciamento con altri diritti; una formula ampia da sola non risolve i conflitti concreti."],"191":["Sostenere i servizi nelle aree interne può contrastare spopolamento e garantire accesso a scuola, salute e trasporti.","Finanziare servizi con pochi utenti può essere costoso; investimenti efficaci richiedono priorità e risultati misurabili."],"192":["Una rappresentanza dedicata può mantenere legami politici con la diaspora e dare voce ai cittadini all'estero.","Il peso elettorale deve restare proporzionato e rappresentativo; distanza e diversa esposizione alle politiche italiane sollevano questioni di equità."],"208":["Regolarizzare chi lavora stabilmente può far emergere rapporti di lavoro, contributi e sfruttamento.","Una regolarizzazione ampia può apparire ingiusta verso chi segue le procedure e incentivare irregolarità se non accompagnata da regole chiare."],"209":["Lavorare durante l'esame della domanda favorisce autonomia, competenze e integrazione e riduce la dipendenza dall'assistenza.","Prima dell'esito possono esserci difficoltà di verifica e rischio di sfruttamento; servono procedure affidabili e tutele."],"210":["La chiusura dei CPR può evitare detenzione amministrativa e condizioni lesive della dignità e della libertà personale.","Senza strumenti alternativi per identificazione e rimpatri, può essere difficile attuare decisioni e affrontare situazioni irregolari."],"211":["Il consenso può lasciare agli utenti più scelta sull'uso dei dati e permettere servizi personalizzati.","Il consenso spesso non è davvero libero o informato; senza limiti ulteriori restano rischi di profilazione, riuso e condivisione non prevista."],"212":["Fondi pubblici possono sostenere ricerca rischiosa, imprese giovani e competenze strategiche che il mercato finanzia poco.","Il sostegno può premiare imprese scelte male o trasferire perdite alla collettività; servono obiettivi verificabili e accesso aperto ai risultati."],"213":["Un divieto protegge da sorveglianza biometrica diffusa, errori identificativi e uso secondario dei dati.","In casi gravi e circoscritti il riconoscimento può aiutare indagini; una disciplina limitata può essere preferita a un divieto totale."]}}};

function coherentAnswers(){const a={},rnd=()=>Math.random();
  AXES.forEach(ax=>{const L=rnd()*2-1;[[ax.p,1],[ax.m,-1]].forEach(([list,sg])=>list.forEach(n=>{if(!QTXT[n])return;const x=3+2*L*sg+(rnd()+rnd()+rnd()-1.5)*2.2;a[n]=Math.max(1,Math.min(5,Math.round(x)))}))});
  Object.keys(QTXT).forEach(n=>{if(!a[n])a[n]=1+Math.floor(rnd()*5)});return a}

function encodeAns(){const hasImp=QKEYS.some(n=>imp[n]&&ans[n]>0),w=hasImp?4:3,bits=[];QKEYS.forEach(n=>{const v=ans[n];const st=v===undefined?0:v+1;bits.push((st>>2)&1,(st>>1)&1,st&1);if(hasImp)bits.push(imp[n]&&v>0?1:0)});while(bits.length%8)bits.push(0);let bin='';for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];bin+=String.fromCharCode(b)}return (hasImp?'2.':'1.')+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeAns(str){try{const ver=str.startsWith('2.')?2:str.startsWith('1.')?1:0;if(!ver)return null;const w=ver===2?4:3;let t=str.slice(2).replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const bin=atob(t);if(bin.length!==Math.ceil(QKEYS.length*w/8))return null;const bits=[];for(let i=0;i<bin.length;i++){const b=bin.charCodeAt(i);for(let j=7;j>=0;j--)bits.push((b>>j)&1)}const out={},im={};for(let k=0;k<QKEYS.length;k++){const st=(bits[k*w]<<2)|(bits[k*w+1]<<1)|bits[k*w+2];if(st>6)return null;if(st>0)out[QKEYS[k]]=st-1;if(ver===2&&bits[k*w+3]&&st>1)im[QKEYS[k]]=1}return {ans:out,imp:im}}catch(e){return null}}

const matchPoints=[100,60,25,5,0];
const answerWeight=v=>(v===1||v===5)?1.4:(v===2||v===4)?1:.6;

   1) peso della domanda: le domande su cui i partiti la pensano in modo diverso contano di più (0,4 + deviazione standard dei loro voti);
   2) livello del caso: punteggio che si otterrebbe rimescolando a caso le tue risposte sugli stessi voti del partito; 0% = come il caso, 100% = coincidenza piena. */

function discW(n){const k=fsrc+'|'+n;if(DISC[k]!==undefined)return DISC[k];const vs=[];PARTIES.forEach(p=>{const v=p[3]()[n];if(v>0)vs.push(v)});let w=.7;if(vs.length>=4){const m=vs.reduce((a,b)=>a+b)/vs.length;w=.4+Math.sqrt(vs.reduce((a,b)=>a+(b-m)**2,0)/vs.length)}return DISC[k]=w}
function affinity(items,src,min=1){
  const cnt=[0,0,0,0,0,0];items.forEach(n=>{const a=ans[n];if(QTXT[n]&&a>0)cnt[a]++});
  let t=0,wt=0,b=0,wb=0,c=0;
  items.forEach(n=>{const a=ans[n],v=src[n];if(!(QTXT[n]&&a>0&&v))return;const q=discW(n),w=answerWeight(a)*(imp[n]?2:1);

  list.forEach(({n})=>{const e=DD[n];const why=!cs.nobasis&&e?((cs.single||(fsrc==='oggi'&&e[1]!==null))?e[3]:e[2]||''):'';const src=cs.srcRules&&e?((cs.srcRules.find(r=>e[2].includes(r[0]))||[0,cs.srcDefault])[1]):'';const citation=src?'<a class="source-link" href="'+src+'" target="_blank" rel="noopener">Fonte: '+esc(e[2])+'</a>':'';
    const d=h('details','','<summary><span class="qt">'+esc(QTXT[n])+'</span><span class="dots"><b>'+ans[n]+'</b><b class="'+DOTCLS[cmp]+'">'+P[n]+'</b></span></summary>'+(why?'<p class="why">'+esc(why)+'</p>':'<p class="why">'+(cs.single?'Nessuna posizione documentata.':CFG.whyDefault)+'</p>')+citation);lc.appendChild(d)});
  if(!list.length)lc.appendChild(h('p','small','Nessuna affermazione da confrontare.'));
  bd.appendChild(lc);bd.appendChild(h('p','small','Il numero tondo è la tua risposta, quello quadrato è il voto da 1 a 5 che ho dato al partito.')).style.marginTop='12px';res.appendChild(bd);
  /* azioni */
  const ft=h('div','foot');const r1=h('button','btn ghost','Rivedi le risposte');r1.onclick=()=>{view='flow';idx=firstStep(0);save();render();window.scrollTo(0,0)};
  const r2=h('button','btn ghost',confirmReset?'Conferma: cancella tutto':'Ricomincia');r2.onclick=()=>{if(!confirmReset){confirmReset=true;render();return}ans={};open={};idx=0;view='intro';confirmReset=false;save();render();window.scrollTo(0,0)};if(!shared&&!testRun){ft.append(r1,r2);res.appendChild(ft)}
  res.appendChild(h('p','small',"Come si calcola: ogni risposta viene confrontata con il voto da 1 a 5 assegnato al partito. Una coincidenza vale 100 punti; uno scarto di 1, 2, 3 o 4 punti vale rispettivamente 60, 25, 5 o 0. Le risposte nette (1 e 5) pesano di più, quelle centrali (3) meno, e contano di più le domande su cui i partiti si distinguono davvero. Le affermazioni che segni come «Conta molto per me» pesano il doppio. Poi il punteggio viene depurato dal caso: 0% significa che hai in comune con quel partito quanto, o meno, di quanto ne avresti rimescolando a caso le tue risposte; 100% una coincidenza piena. Per questo le percentuali sono più basse e più distanti di una semplice media. La copertura varia da partito a partito: inserisco un voto solo quando trovo una posizione o una fonte documentabile. Per Potere al Popolo! uso il Programma politico ufficiale 2025, presentato dal movimento come edizione pilota, e confronto solo quelle per cui trovo una posizione documentata. Accanto al 2025 uso il programma elettorale PaP 2018 e, quando indicato, il programma di Unione Popolare 2022 (coalizione con PaP); i temi senza riscontro restano esclusi. Per gli altri partiti uso, a seconda della disponibilità, programmi elettorali 2022, programmi europei 2024, posizioni recenti, atti legislativi e votazioni d'aula tracciate da Openpolis. Per Futuro Nazionale uso la base programmatica ufficiale, le dichiarazioni del vertice e i voti d'aula dei deputati. Le risposte e i profili restano esclusivamente all'interno del tuo browser.")).style.marginTop='24px';
}
function render(){
  if(shared&&view!=='res')exitShared();
  renderBar();const m=$('app');m.classList.remove('has-guide-rail');m.innerHTML='';
  if(view==='intro')renderIntro(m);else if(view==='flow')renderFlow(m);else if(view==='guide')renderGuide(m);else renderRes(m);
}
$('home').onclick=()=>{if(testRun)exitRandomTest();view='intro';menuOpen=false;save();render();window.scrollTo(0,0)};
$('sbtn').onclick=()=>{menuOpen=!menuOpen;pmenuOpen=false;renderBar()};$('pbtn').onclick=()=>{pmenuOpen=!pmenuOpen;menuOpen=false;renaming=false;confirmDel=false;renderBar()};
window.addEventListener('hashchange',()=>{const was=shared;if(!shared)save();if(tryShared()){menuOpen=false;pmenuOpen=false;render();window.scrollTo(0,0)}});
document.addEventListener('keydown',e=>{if(pmenuOpen&&e.key==='Escape'){pmenuOpen=false;renaming=false;confirmDel=false;renderBar();return}if(guideDrawerOpen&&e.key==='Escape'){guideDrawerOpen=false;render();e.preventDefault();return}if(view!=='flow')return;const t=e.target;if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'))return;const st=steps[idx];
  if(st.k==='q'&&e.key>='0'&&e.key<='5'){const v=+e.key;pick(st.n,v===0?(ans[st.n]===0?undefined:0):(v===ans[st.n]?undefined:v));e.preventDefault()}
  else if((e.key==='i'||e.key==='I')&&st.k==='q'){toggleImp(st.n);e.preventDefault()}else if(e.key==='ArrowRight'){step(1)}else if(e.key==='ArrowLeft'){step(-1)}else if(e.key==='Enter'&&st.k==='sec'&&t.tagName!=='BUTTON'){step(1)}});
document.addEventListener('click',e=>{if((menuOpen||pmenuOpen)&&!e.composedPath().some(n=>n.classList&&n.classList.contains('barin'))){menuOpen=false;pmenuOpen=false;renaming=false;confirmDel=false;renderBar()}});
render();
</script>
